    window.sendInboxToSticky = (idx) => {
      const book = getActiveBook();
      const note = book.inboxNotes[idx];
      addMediaElement('sticky', note.text, '');
      book.inboxNotes.splice(idx, 1);
      renderInbox();
      saveToStorage();
    };

    window.removeInboxNote = (idx) => {
      const book = getActiveBook();
      book.inboxNotes.splice(idx, 1);
      renderInbox();
      saveToStorage();
    };

    const searchModal = document.getElementById('searchModal');
    document.getElementById('btnOpenSearch').onclick = () => {
      searchModal.classList.add('open');
      document.getElementById('globalSearchInput').focus();
    };
    function closeSearchModal() { searchModal.classList.remove('open'); }

    window.executeGlobalSearch = (query) => {
      const container = document.getElementById('searchResultsContainer');
      container.innerHTML = '';
      const q = query.trim().toLowerCase();
      if (!q) return;

      let resultsCount = 0;
      appState.books.forEach(book => {
        book.chapters.forEach(chap => {
          chap.pages.forEach(page => {
            const matchTitle = (page.title || '').toLowerCase().includes(q);
            const matchContent = (page.contentHTML || '').toLowerCase().includes(q);
            const matchScrap = (page.elements || []).some(el => (el.caption || '').toLowerCase().includes(q) || (el.text || '').toLowerCase().includes(q));

            if (matchTitle || matchContent || matchScrap) {
              resultsCount++;
              const div = document.createElement('div');
              div.style.cssText = 'padding:6px 10px; background:#fafaf9; border:1px solid #e7e5e4; border-radius:4px; cursor:pointer;';
              div.innerHTML = `
                <div style="font-weight:700; color:var(--accent); font-size:12.5px;">${escapeHTML(page.title || 'Sem título')}</div>
                <div style="font-size:10.5px; color:#78716c;">${escapeHTML(book.bookTitle)} > ${escapeHTML(chap.title)}</div>
              `;
              div.onclick = () => {
                syncCurrentPageToState();
                inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
                isCanvasDirtySinceLoad = false;

                appState.activeBookId = book.id;
                book.activeChapterId = chap.id;
                book.activePageId = page.id;
                renderAll();
                saveToStorage();
                closeSearchModal();
              };
              container.appendChild(div);
            }
          });
        });
      });

      if (resultsCount === 0) {
        container.innerHTML = '<div style="font-size:11px; color:#a8a29e; text-align:center; padding:10px;">Nenhum resultado encontrado.</div>';
      }
    };

    window.toggleZenMode = () => {
      document.body.classList.toggle('zen-mode');
    };

    window.addEventListener('keydown', (e) => {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;
      
      if (isCtrlOrCmd && !e.altKey) {
        if (e.key.toLowerCase() === 'z') {
          e.preventDefault();
          if (e.shiftKey) executeRedo();
          else executeUndo();
          return;
        }
        if (e.key.toLowerCase() === 'y') {
          e.preventDefault();
          executeRedo();
          return;
        }
      }

      if (isCtrlOrCmd && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchModal.classList.add('open');
        document.getElementById('globalSearchInput').focus();
        return;
      }

      if (e.key === 'Escape') {
        document.body.classList.remove('zen-mode');
        closeDrawers();
        closeDiagramModal();
        closeSearchModal();
        toggleMobileSidebar(false);
      }
    });

    document.getElementById('btnUndo').onclick = () => executeUndo();
    document.getElementById('btnRedo').onclick = () => executeRedo();

    function closeDrawers() {
      document.querySelectorAll('.side-drawer').forEach(d => d.classList.remove('open'));
    }

    const textEditor = document.getElementById('textEditor');
    const selectionTooltip = document.getElementById('selectionTooltip');
    const threadDrawer = document.getElementById('threadDrawer');

    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) {
        if (!selectionTooltip.matches(':hover')) selectionTooltip.style.display = 'none';
        return;
      }
      const range = selection.getRangeAt(0);
      if (!textEditor.contains(range.commonAncestorContainer)) {
        selectionTooltip.style.display = 'none';
        return;
      }
      const text = selection.toString().trim();
      if (text.length > 0) {
        activeSelectionRange = range.cloneRange();
        const rect = range.getBoundingClientRect();
        selectionTooltip.style.display = 'flex';
        selectionTooltip.style.left = `${rect.left + (rect.width / 2)}px`;
        selectionTooltip.style.top = `${rect.top + window.scrollY}px`;
      } else {
        selectionTooltip.style.display = 'none';
      }
    });

    document.getElementById('btnTooltipHighlight').onclick = () => {
      createThreadFromSelection(false);
      selectionTooltip.style.display = 'none';
    };

    document.getElementById('btnTooltipComment').onclick = () => {
      createThreadFromSelection(true);
      selectionTooltip.style.display = 'none';
    };

    document.getElementById('btnTooltipLink').onclick = () => {
      if (!activeSelectionRange) return;
      const text = activeSelectionRange.toString().trim();
      if (!text) return;
      const span = document.createElement('span');
      span.className = 'wiki-link';
      span.setAttribute('data-target-page', text);
      span.textContent = `🔗 ${text}`;
      activeSelectionRange.deleteContents();
      activeSelectionRange.insertNode(span);
      selectionTooltip.style.display = 'none';
      syncCurrentPageToState();
      pushHistoryState(textEditor.innerHTML, true);
      saveToStorage();
    };

    function createThreadFromSelection(openDrawerWithComment = false) {
      if (!activeSelectionRange) return;
      const selectedText = activeSelectionRange.toString().trim();
      if (!selectedText) return;

      const threadId = 'th_' + Date.now();
      const mark = document.createElement('mark');
      mark.className = 'craft-highlight';
      mark.setAttribute('data-thread-id', threadId);
      mark.title = 'Clique para ver a discussão';

      try {
        activeSelectionRange.surroundContents(mark);
      } catch {
        const frag = activeSelectionRange.extractContents();
        mark.appendChild(frag);
        activeSelectionRange.insertNode(mark);
      }

      const page = getActivePage();
      if (!page.threads) page.threads = [];

      const newThread = {
        id: threadId,
        snippet: selectedText,
        createdAt: new Date().toLocaleString(),
        resolved: false,
        comments: []
      };

      if (openDrawerWithComment) {
        const comment = prompt(`Comentário para "${selectedText.slice(0, 30)}...":`);
        if (comment && comment.trim()) {
          newThread.comments.push({
            id: 'c_' + Date.now(),
            author: 'Você',
            text: comment.trim(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            replies: []
          });
        }
      }

      page.threads.push(newThread);
      window.getSelection().removeAllRanges();
      syncCurrentPageToState();
      pushHistoryState(textEditor.innerHTML, true);
      saveToStorage();
      renderThreads();

      if (openDrawerWithComment || newThread.comments.length > 0) openThreadDrawer(threadId);
    }

    textEditor.addEventListener('click', (e) => {
      const mark = e.target.closest('mark.craft-highlight');
      if (mark) openThreadDrawer(mark.getAttribute('data-thread-id'));
    });

    function openThreadDrawer(focusThreadId = null) {
      closeDrawers();
      threadDrawer.classList.add('open');
      renderThreads();
      if (focusThreadId) {
        setTimeout(() => {
          const card = document.getElementById(`card_${focusThreadId}`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.borderColor = 'var(--accent)';
          }
        }, 150);
      }
    }

    document.getElementById('toggleThreadsBtn').onclick = () => {
      const isOpen = threadDrawer.classList.contains('open');
      closeDrawers();
      if (!isOpen) threadDrawer.classList.add('open');
      renderThreads();
    };

    window.setThreadFilter = (filter) => {
      currentThreadFilter = filter;
      document.getElementById('thFilterAll').classList.toggle('active', filter === 'all');
      document.getElementById('thFilterOpen').classList.toggle('active', filter === 'open');
      document.getElementById('thFilterResolved').classList.toggle('active', filter === 'resolved');
      renderThreads();
    };

    function renderThreads() {
      const page = getActivePage();
      const container = document.getElementById('threadsListContainer');
      const badge = document.getElementById('openThreadsCount');
      container.innerHTML = '';

      if (!page || !page.threads) { badge.style.display = 'none'; return; }
      const openCount = page.threads.filter(t => !t.resolved).length;
      badge.textContent = openCount;
      badge.style.display = openCount > 0 ? 'inline-block' : 'none';

      let filtered = page.threads;
      if (currentThreadFilter === 'open') filtered = filtered.filter(t => !t.resolved);
      if (currentThreadFilter === 'resolved') filtered = filtered.filter(t => t.resolved);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#a8a29e; font-size:11px; margin-top:30px;">Nenhuma discussão ${currentThreadFilter === 'resolved' ? 'resolvida' : 'aqui'}.</div>`;
        return;
      }

      filtered.forEach(th => {
        const card = document.createElement('div');
        card.style.cssText = `background:#fafaf9; border:1px solid ${th.resolved ? '#cbd5e1' : '#e7e5e4'}; border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:6px; opacity:${th.resolved ? 0.75 : 1};`;
        card.id = `card_${th.id}`;

        let commentsHTML = '';
        (th.comments || []).forEach(c => {
          commentsHTML += `
            <div style="background:#fff; border:1px solid #f0eee9; border-radius:4px; padding:6px; font-size:11.5px; display:flex; flex-direction:column; gap:3px;">
              <div style="display:flex; justify-content:space-between; font-size:9.5px; color:#a8a29e; font-weight:600;">
                <span><b>${escapeHTML(c.author)}</b></span>
                <span>${c.time || ''}</span>
              </div>
              <div style="color:#292524;">${escapeHTML(c.text)}</div>
              <div style="text-align:right;">
                <button style="border:none; background:transparent; font-size:9.5px; color:#b45309; cursor:pointer;" onclick="replyToComment('${th.id}', '${c.id}')">↳ Responder</button>
              </div>
              ${(c.replies || []).map(r => `
                <div style="margin-left:8px; border-left:2px solid #cbd5e1; padding-left:5px; font-size:10.5px; margin-top:2px;">
                  <b>${escapeHTML(r.author)}</b>: ${escapeHTML(r.text)}
                </div>
              `).join('')}
            </div>
          `;
        });

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div style="font-size:11.5px; font-style:italic; color:#78716c; border-left:3px solid #facc15; padding-left:6px;">"${escapeHTML(th.snippet)}"</div>
            <button class="btn-danger btn-icon" onclick="deleteThread('${th.id}')">✕</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:4px;">${commentsHTML || '<small style="color:#a8a29e; font-size:10px;">Sem comentários.</small>'}</div>
          <div style="display:flex; gap:3px;">
            <input type="text" id="input_${th.id}" placeholder="Responder..." style="flex:1; padding:3px 6px; border:1px solid #d6d3d1; border-radius:4px; font-size:11px;" onkeydown="if(event.key==='Enter') addComment('${th.id}')" />
            <button class="btn-accent" style="padding:3px 6px; font-size:10px;" onclick="addComment('${th.id}')">Enviar</button>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #e7e5e4; padding-top:4px;">
            <button style="font-size:10px; padding:1px 5px;" onclick="toggleResolveThread('${th.id}')">${th.resolved ? '🔄 Reabrir' : '✓ Resolver'}</button>
            <span style="font-size:9px; color:#a8a29e;">${th.createdAt}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addComment = (threadId) => {
      const input = document.getElementById(`input_${threadId}`);
      if (!input || !input.value.trim()) return;
      const page = getActivePage();
      const thread = page.threads.find(t => t.id === threadId);
      if (thread) {
        if (!thread.comments) thread.comments = [];
        thread.comments.push({
          id: 'c_' + Date.now(),
          author: 'Você',
          text: input.value.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replies: []
        });
        saveToStorage();
        renderThreads();
      }
    };

    window.replyToComment = (threadId, commentId) => {
      const reply = prompt('Sua resposta:');
      if (!reply || !reply.trim()) return;
      const page = getActivePage();
      const thread = page.threads.find(t => t.id === threadId);
      if (thread) {
        const comment = thread.comments.find(c => c.id === commentId);
        if (comment) {
          if (!comment.replies) comment.replies = [];
          comment.replies.push({
            id: 'r_' + Date.now(),
            author: 'Você',
            text: reply.trim(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveToStorage();
          renderThreads();
        }
      }
    };

    window.toggleResolveThread = (threadId) => {
      const page = getActivePage();
      const thread = page.threads.find(t => t.id === threadId);
      if (!thread) return;
      thread.resolved = !thread.resolved;
      const mark = textEditor.querySelector(`mark[data-thread-id="${threadId}"]`);
      if (mark) mark.classList.toggle('resolved', thread.resolved);
      syncCurrentPageToState();
      saveToStorage();
      renderThreads();
    };

    window.deleteThread = (threadId) => {
      if (!confirm('Remover esta discussão?')) return;
      const page = getActivePage();
      page.threads = page.threads.filter(t => t.id !== threadId);
      const mark = textEditor.querySelector(`mark[data-thread-id="${threadId}"]`);
      if (mark) {
        const parent = mark.parentNode;
        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
        parent.removeChild(mark);
      }
      syncCurrentPageToState();
      pushHistoryState(textEditor.innerHTML, true);
      saveToStorage();
      renderThreads();
    };

    function renderCollageElements() {
      const container = document.getElementById('collageContainer');
      const editor = document.getElementById('textEditor');
      container.querySelectorAll('.craft-media-card').forEach(el => el.remove());

      const page = getActivePage();
      if (!page.elements) page.elements = [];

      page.elements.forEach(item => {
        const el = createCraftMediaCard(item);
        if (item.mode === 'free') {
          container.appendChild(el);
        } else {
          container.insertBefore(el, editor);
        }
      });
      updateInfinitePageHeight();
    }

    function createCraftMediaCard(item) {
      const div = document.createElement('div');
      const isFree = item.mode === 'free';
      const type = item.type;

      let styleClass = 'style-polaroid';
      if (type === 'drawing') styleClass = 'style-drawing';
      if (type === 'sticky') styleClass = 'style-sticky';
      if (type === 'audio') styleClass = 'style-cassette';
      if (type === 'file') styleClass = 'style-filetag';
      if (type === 'diagram') styleClass = 'style-diagram';

      div.className = `craft-media-card ${styleClass} ${isFree ? 'mode-free' : `mode-flow align-${item.align || 'right'}`}`;
      div.id = item.id;
      div.style.width = (item.width || (type === 'diagram' ? 440 : (type === 'sticky' ? 240 : 300))) + 'px';

      if (isFree) {
        div.style.left = (item.x || 20) + 'px';
        div.style.top = (item.y || 30) + 'px';
      } else {
        div.style.left = '';
        div.style.top = '';
      }

      let innerCardHTML = '';

      if (type === 'drawing') {
        innerCardHTML = `
          <div class="drawing-media-box" style="width:100%; display:flex; justify-content:center; align-items:center;">
            <img src="${item.src}" alt="Desenho Recortado" style="width:100%; height:auto; display:block; pointer-events:none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));" />
          </div>
        `;
      } else if (type === 'image') {
        innerCardHTML = `
          <div class="polaroid-media-box">
            <img src="${item.src}" alt="Foto" />
          </div>
          <input 
            type="text" 
            class="polaroid-caption" 
            value="${escapeHTML(item.caption || '')}" 
            placeholder="Legenda..." 
            oninput="updateItemCaption('${item.id}', this.value)"
          />
        `;
      } else if (type === 'sticky') {
        innerCardHTML = `
          <div 
            class="sticky-content-area" 
            contenteditable="true" 
            oninput="updateStickyContent('${item.id}', this.innerHTML)"
          >${item.text || ''}</div>
        `;
      } else if (type === 'audio') {
        innerCardHTML = `
          <div class="cassette-label-header">
            <span>📼</span>
            <input 
              type="text" 
              class="cassette-title-input" 
              value="${escapeHTML(item.caption || 'Áudio')}" 
              placeholder="Gravação..." 
              oninput="updateItemCaption('${item.id}', this.value)"
            />
          </div>
          <div class="cassette-reels">
            <span>● SIDE A ●</span>
            <span>VOICE RECORDER</span>
          </div>
          <audio controls src="${item.src}" style="width:100%; height:30px; filter:invert(0.9); border-radius:4px;"></audio>
        `;
      } else if (type === 'file') {
        innerCardHTML = `
          <div class="filetag-paperclip">📎</div>
          <div class="filetag-body">
            <input 
              type="text" 
              class="filetag-name-input" 
              value="${escapeHTML(item.caption || item.fileName || 'Arquivo')}" 
              placeholder="Nome..." 
              oninput="updateItemCaption('${item.id}', this.value)"
            />
            <div class="filetag-footer">
              <span style="font-size:10px; color:#78716c; font-weight:600;">${item.fileSize || 'Arquivo'}</span>
              <a href="${item.src}" download="${item.fileName || 'arquivo'}" class="btn" style="padding:1px 6px; font-size:9.5px; background:#fafaf9;">⬇ Baixar</a>
            </div>
          </div>
        `;
      } else if (type === 'diagram') {
        innerCardHTML = `
          <div class="diagram-viewport">
            ${item.svgData}
          </div>
          <input 
            type="text" 
            class="diagram-caption" 
            value="${escapeHTML(item.caption || 'Diagrama')}" 
            placeholder="Título..." 
            oninput="updateItemCaption('${item.id}', this.value)"
          />
        `;
      }

      div.innerHTML = `
        <div class="frame-quick-actions">
          <button class="frame-drag-handle" title="Arrastar Livremente (✥)">✥</button>
          <button title="Flutuar à Esquerda" onclick="setItemAlign('${item.id}', 'left')">⇦</button>
          <button title="Centralizado" onclick="setItemAlign('${item.id}', 'center')">◽</button>
          <button title="Flutuar à Direita" onclick="setItemAlign('${item.id}', 'right')">⇨</button>
          <button class="btn-danger" title="Excluir" onclick="deleteMediaElement('${item.id}')">✕</button>
        </div>
        ${innerCardHTML}
        <div class="resize-handle" title="Redimensionar"></div>
      `;

      setupCardInteractions(div, item);
      return div;
    }

    function setupCardInteractions(cardElement, itemData) {
      const dragHandle = cardElement.querySelector('.frame-drag-handle');
      const resizeHandle = cardElement.querySelector('.resize-handle');

      if (dragHandle) {
        dragHandle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();

          if (itemData.mode !== 'free') {
            itemData.mode = 'free';
            itemData.x = cardElement.offsetLeft;
            itemData.y = cardElement.offsetTop;
            renderCollageElements();
            return;
          }

          cardElement.classList.add('dragging');
          try { dragHandle.setPointerCapture(e.pointerId); } catch (err) {}

          const startX = e.clientX;
          const startY = e.clientY;
          const origLeft = cardElement.offsetLeft;
          const origTop = cardElement.offsetTop;

          function onPointerMove(moveEvent) {
            const deltaX = moveEvent.clientX - startX;
            const deltaY = moveEvent.clientY - startY;
            const newLeft = Math.max(0, origLeft + deltaX);
            const newTop = Math.max(0, origTop + deltaY);

            cardElement.style.left = newLeft + 'px';
            cardElement.style.top = newTop + 'px';
            itemData.x = newLeft;
            itemData.y = newTop;
            updateInfinitePageHeight();
          }

          function onPointerUp(upEvent) {
            cardElement.classList.remove('dragging');
            try {
              if (dragHandle.hasPointerCapture(upEvent.pointerId)) {
                dragHandle.releasePointerCapture(upEvent.pointerId);
              }
            } catch (err) {}
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            updateInfinitePageHeight();
            saveToStorage();
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });
      }

      if (resizeHandle) {
        resizeHandle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          try { resizeHandle.setPointerCapture(e.pointerId); } catch (err) {}

          const startX = e.clientX;
          const startWidth = cardElement.offsetWidth;

          function onResizeMove(moveEvent) {
            const deltaX = moveEvent.clientX - startX;
            const newWidth = Math.max(100, Math.min(startWidth + deltaX, 1200));
            cardElement.style.width = newWidth + 'px';
            itemData.width = newWidth;
          }

          function onResizeUp(upEvent) {
            try {
              if (resizeHandle.hasPointerCapture(upEvent.pointerId)) {
                resizeHandle.releasePointerCapture(upEvent.pointerId);
              }
            } catch (err) {}
            window.removeEventListener('pointermove', onResizeMove);
            window.removeEventListener('pointerup', onResizeUp);
            updateInfinitePageHeight();
            saveToStorage();
          }

          window.addEventListener('pointermove', onResizeMove);
          window.addEventListener('pointerup', onResizeUp);
        });
      }
    }

    function addMediaElement(type, srcOrData, defaultCaption = '', extra = {}) {
      const page = getActivePage();
      if (!page.elements) page.elements = [];

      const newItem = {
        id: 'media_' + Date.now(),
        type: type,
        src: (type === 'image' || type === 'drawing' || type === 'audio' || type === 'file') ? srcOrData : null,
        svgData: type === 'diagram' ? srcOrData : null,
        text: type === 'sticky' ? srcOrData : null,
        caption: defaultCaption,
        width: type === 'diagram' ? 440 : (type === 'sticky' ? 240 : (type === 'drawing' ? (extra.width || 200) : 300)),
        mode: extra.mode || 'flow',
        align: extra.align || 'right',
        x: extra.x !== undefined ? extra.x : 30,
        y: extra.y !== undefined ? extra.y : 40,
        ...extra
      };

      page.elements.push(newItem);
      renderCollageElements();
      saveToStorage();
    }

    window.setItemAlign = (id, align) => {
      const page = getActivePage();
      const item = page.elements.find(el => el.id === id);
      if (item) {
        item.mode = 'flow';
        item.align = align;
        renderCollageElements();
        saveToStorage();
      }
    };

    window.updateItemCaption = (id, caption) => {
      const page = getActivePage();
      const item = page.elements.find(el => el.id === id);
      if (item) {
        item.caption = caption;
        saveToStorage();
      }
    };

    window.updateStickyContent = (id, text) => {
      const page = getActivePage();
      const item = page.elements.find(el => el.id === id);
      if (item) {
        item.text = text;
        saveToStorage();
      }
    };

    window.deleteMediaElement = (id) => {
      const page = getActivePage();
      page.elements = page.elements.filter(el => el.id !== id);
      renderCollageElements();
      saveToStorage();
    };

    function formatDoc(cmd, val = null) {
      document.execCommand(cmd, false, val);
      document.getElementById('textEditor').focus();
      pushHistoryState(document.getElementById('textEditor').innerHTML, true);
    }

    function insertHtmlAtCursor(html) {
      const editor = document.getElementById('textEditor');
      editor.focus();
      const sel = window.getSelection();
      if (sel.getRangeAt && sel.rangeCount) {
        let range = sel.getRangeAt(0);
        if (!editor.contains(range.commonAncestorContainer)) {
          range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
        }
        range.deleteContents();
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const frag = document.createDocumentFragment();
        let node, last;
        while ((node = temp.firstChild)) last = frag.appendChild(node);
        range.insertNode(frag);
        if (last) {
          range = range.cloneRange();
          range.setStartAfter(last);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      } else {
        editor.innerHTML += html;
      }
      syncCurrentPageToState();
      pushHistoryState(editor.innerHTML, true);
      saveToStorage();
    }

    document.getElementById('btnInsertTable').onclick = () => {
      const r = parseInt(prompt('Linhas:', '3'), 10) || 3;
      const c = parseInt(prompt('Colunas:', '3'), 10) || 3;
      let html = '<table class="craft-table"><thead><tr>';
      for (let j = 1; j <= c; j++) html += `<th>Coluna ${j}</th>`;
      html += '</tr></thead><tbody>';
      for (let i = 2; i <= r; i++) {
        html += '<tr>';
        for (let j = 1; j <= c; j++) html += '<td>Dado...</td>';
        html += '</tr>';
      }
      html += '</tbody></table><p><br></p>';
      insertHtmlAtCursor(html);
    };

    document.getElementById('btnInsertQuote').onclick = () => {
      const sel = window.getSelection().toString().trim();
      const text = sel || 'Sua citação marcante aqui...';
      insertHtmlAtCursor(`<blockquote class="craft-quote">“${escapeHTML(text)}”<cite>— Autor</cite></blockquote><p><br></p>`);
    };

    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (evt) => addMediaElement('image', evt.target.result, 'Foto Instantânea');
          reader.readAsDataURL(blob);
          e.preventDefault();
        }
      }
    });

    document.getElementById('imageInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => addMediaElement('image', evt.target.result, file.name.replace(/\.[^/.]+$/, ""));
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    document.getElementById('btnAddSticky').onclick = () => addMediaElement('sticky', '', 'Post-it');

    let mediaRecorder, audioChunks = [];
    document.getElementById('recordAudioBtn').onclick = async function() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        this.classList.remove('recording-pulse');
        this.textContent = '🎙️ Gravar';
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const reader = new FileReader();
            reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
            reader.onloadend = () => {
              addMediaElement('audio', reader.result, `Gravação ${new Date().toLocaleTimeString()}`);
            };
          };
          mediaRecorder.start();
          this.classList.add('recording-pulse');
          this.textContent = '⏹️ Parar';
        } catch {
          alert('Microfone não acessível.');
        }
      }
    };

    document.getElementById('fileAttachment').onchange = (e) => {
      const files = Array.from(e.target.files);
      files.forEach(f => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          addMediaElement('file', evt.target.result, f.name, {
            fileName: f.name,
            fileSize: (f.size / 1024).toFixed(1) + ' KB'
          });
        };
        reader.readAsDataURL(f);
      });
      e.target.value = '';
    };

    document.getElementById('btnAddChapter').onclick = () => {
      const book = getActiveBook();
      const name = prompt('Nome do novo Capítulo (Domo):', `Capítulo ${book.chapters.length + 1}`);
      if (!name) return;
      syncCurrentPageToState();
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      isCanvasDirtySinceLoad = false;

      const newPid = 'p_' + Date.now();
      const newCid = 'c_' + Date.now();
      book.chapters.push({
        id: newCid,
        title: name,
        pages: [{ id: newPid, title: 'Página 1', paperOrientation: 'orientation-portrait', fontSize: 24, contentHTML: '', elements: [], inkDataURL: null, threads: [], snapshots: [] }]
      });
      book.activeChapterId = newCid;
      book.activePageId = newPid;
      renderAll();
      saveToStorage();
    };

    document.getElementById('btnAddPage').onclick = () => {
      const book = getActiveBook();
      const chap = getActiveChapter();
      if (!chap) return;
      syncCurrentPageToState();
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      isCanvasDirtySinceLoad = false;

      const newPid = 'p_' + Date.now();
      chap.pages.push({
        id: newPid,
        title: `Página ${chap.pages.length + 1}`,
        paperOrientation: 'orientation-portrait',
        fontSize: 24,
        contentHTML: '',
        elements: [],
        inkDataURL: null,
        threads: [],
        snapshots: []
      });
      book.activePageId = newPid;
      renderAll();
      saveToStorage();
      if (window.innerWidth <= 860) toggleMobileSidebar(false);
    };

    window.renameChapter = (cId) => {
      const book = getActiveBook();
      const chapter = book.chapters.find(c => c.id === cId);
      if (!chapter) return;
      const newTitle = prompt('Novo nome para o Capítulo:', chapter.title);
      if (newTitle && newTitle.trim()) {
        chapter.title = newTitle.trim();
        renderNavigation();
        saveToStorage();
      }
    };

    window.deleteChapter = (e, cId) => {
      e.stopPropagation();
      const book = getActiveBook();
      if (book.chapters.length <= 1) {
        alert('O caderno precisa ter pelo menos um capítulo.');
        return;
      }
      if (!confirm('Excluir este capítulo e todas as suas páginas?')) return;
      syncCurrentPageToState();
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      isCanvasDirtySinceLoad = false;

      book.chapters = book.chapters.filter(c => c.id !== cId);
      book.activeChapterId = book.chapters[0].id;
      book.activePageId = book.chapters[0].pages[0]?.id || null;
      renderAll();
      saveToStorage();
    };

    window.deletePage = (e, pId) => {
      e.stopPropagation();
      const book = getActiveBook();
      const chap = getActiveChapter();
      if (chap.pages.length <= 1) {
        alert('O capítulo precisa ter pelo menos uma página.');
        return;
      }
      if (!confirm('Excluir esta página?')) return;
      syncCurrentPageToState();
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      isCanvasDirtySinceLoad = false;

      chap.pages = chap.pages.filter(p => p.id !== pId);
      book.activePageId = chap.pages[0].id;
      renderAll();
      saveToStorage();
    };

    function saveToStorage() {
      syncCurrentPageToState();
      try {
        localStorage.setItem('scrapbook_craft_data', JSON.stringify(appState));
      } catch (err) {
        console.warn('Armazenamento cheio.');
      }
    }

    function loadFromStorage() {
      const raw = localStorage.getItem('scrapbook_craft_data');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed.books && Array.isArray(parsed.books)) {
            appState = parsed;
          } else if (parsed.chapters && Array.isArray(parsed.chapters)) {
            const legacyBook = {
              id: 'b_' + Date.now(),
              bookTitle: parsed.bookTitle || 'Meu Caderno Artesanal',
              activeChapterId: parsed.activeChapterId || parsed.chapters[0]?.id,
              activePageId: parsed.activePageId || parsed.chapters[0]?.pages[0]?.id,
              inboxNotes: parsed.inboxNotes || [],
              chapters: parsed.chapters
            };
            appState = {
              activeBookId: legacyBook.id,
              books: [legacyBook]
            };
          } else {
            appState = createInitialAppState();
          }
        } catch {
          appState = createInitialAppState();
        }
      } else {
        appState = createInitialAppState();
      }
      renderAll();
    }

    document.getElementById('pageTitle').oninput = (e) => {
      autoResizeTextarea(e.target);
      syncCurrentPageToState();
      renderNavigation();
      saveToStorage();
    };

    document.getElementById('textEditor').addEventListener('input', () => {
      pushHistoryState(document.getElementById('textEditor').innerHTML);
      saveToStorage();
    });

    document.getElementById('bookTitleInput').addEventListener('input', (e) => {
      const book = getActiveBook();
      book.bookTitle = e.target.value.trim() || 'Meu Caderno Artesanal';
      document.title = `${book.bookTitle} - Scrapbook`;
      renderBookSelector();
      saveToStorage();
    });

    // Backup JSON do Caderno Atual
    document.getElementById('btnExport').onclick = () => {
      syncCurrentPageToState();
      const currentBook = getActiveBook();
      const blob = new Blob([JSON.stringify(currentBook, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const name = (currentBook.bookTitle || 'caderno').toLowerCase().replace(/[^a-z0-9]/gi, '_');
      a.download = `${name}_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    };

    // Importar JSON
    document.getElementById('inputImport').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const importedData = JSON.parse(evt.target.result);
          if (importedData.books && Array.isArray(importedData.books)) {
            appState = importedData;
          } else if (importedData.chapters && Array.isArray(importedData.chapters)) {
            if (!importedData.id) importedData.id = 'b_' + Date.now();
            const existingIdx = appState.books.findIndex(b => b.id === importedData.id);
            if (existingIdx >= 0) {
              if (confirm(`Já existe um caderno com este ID ("${appState.books[existingIdx].bookTitle}"). Substituir?`)) {
                appState.books[existingIdx] = importedData;
              } else {
                importedData.id = 'b_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                importedData.bookTitle = (importedData.bookTitle || 'Caderno') + ' (Cópia)';
                appState.books.push(importedData);
              }
            } else {
              appState.books.push(importedData);
            }
            appState.activeBookId = importedData.id;
          } else {
            throw new Error('Formato inválido');
          }
          
          inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
          isCanvasDirtySinceLoad = false;
          renderAll();
          saveToStorage();
          alert('Caderno importado com sucesso!');
        } catch {
          alert('Arquivo JSON inválido.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    document.getElementById('btnResetAll').onclick = () => {
      if (confirm('Atenção: Isso apagará TODOS os cadernos do navegador!')) {
        localStorage.removeItem('scrapbook_craft_data');
        appState = createInitialAppState();
        renderAll();
      }
    };

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    window.onload = loadFromStorage;
  </script>
